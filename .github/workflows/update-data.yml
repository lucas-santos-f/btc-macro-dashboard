name: update data

# manual on purpose: data.json + predictor.json are ~1MB per refresh and a daily
# cron turns the history into a wall of bot commits
on: workflow_dispatch

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_predictor.py
      - run: python fetch_data.py --years 7
      - run: python predictor.py --market-years 20
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/predictor.json predictor_history.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +%F)"
          git push
