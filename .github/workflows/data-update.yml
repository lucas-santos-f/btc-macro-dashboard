name: Atualizar dados e preditor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - predictor.py
      - fetch_data.py
      - fontes.py
      - requirements.txt
      - .github/workflows/data-update.yml
  schedule:
    - cron: "5 0 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

concurrency:
  group: btc-macro-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Executar testes
        run: python -m unittest -v test_predictor.py
      - name: Atualizar séries do dashboard
        run: python fetch_data.py --anos 7
      - name: Atualizar modelos e backtests
        run: python predictor.py --anos-mercado 20 --backtest
      - name: Persistir dados gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/predictor.json predictor_history.csv
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de dados."
          else
            git commit -m "data: atualização automática $(date -u +%F)"
            git push
          fi
